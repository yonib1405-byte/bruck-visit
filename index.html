<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3427">
<title>ביקור בנכס · ברוק</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --band:#1f3427;--band-2:#263d2f;--band-fg:#dbe5e3;--band-muted:#9fb3ab;--gold:#c99d47;--gold-2:#bf9745;
  --bg:#e4ebe9;--surface:#fff;--sunk:#eef3f1;--line:#cfdad6;--fg:#1f3427;--muted:#5b6f66;
  --ok:#2f7a4b;--ok-bg:#e1f0e6;--warn:#a4620e;--warn-bg:#f8ecd6;--bad:#a83a32;--bad-bg:#f7e2df;
  --r:12px;--f:"Assistant","Heebo","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:17px;line-height:1.45;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:var(--band);color:var(--band-fg);border-bottom:1px solid var(--gold);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
header.top h1{margin:0;font-size:1.25rem;font-weight:400;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .mark{color:var(--gold);letter-spacing:.14em;font-weight:300;direction:ltr;font-size:1.05rem}
.ib{background:none;border:1px solid rgba(201,157,71,.55);color:var(--gold);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.95rem}
.ib.solid{background:var(--gold);color:var(--band);border-color:var(--gold)}
.net{font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--band-2);color:var(--band-muted)}
.net.on{color:#9ee0b4}
main{padding:16px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));max-width:1100px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:1.15rem;font-weight:600}
.hint{color:var(--muted);font-size:.88rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:600;min-height:44px}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--band)}
.btn.dark{background:var(--band);border-color:var(--band);color:var(--gold)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column;gap:10px}
.case{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:start;width:100%}
.case .no{font-weight:700;color:var(--gold-2);direction:ltr;min-width:84px}
.case .main{flex:1;min-width:0}
.case .main b{display:block;font-size:1.05rem}
.case .st{font-size:.82rem;border-radius:999px;padding:2px 10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.st.draft{background:var(--warn-bg);color:var(--warn)}
.st.done{background:var(--ok-bg);color:var(--ok)}
.tabs{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin:-16px 0 10px;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--band);color:var(--gold);border-color:var(--band)}
.grp{margin-bottom:18px}
.grp>.lbl{font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.grp>.lbl small{font-weight:400;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:48px;font-size:1rem}
.chip[aria-pressed="true"]{background:var(--band);color:#fff;border-color:var(--band)}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--gold)}
.notes{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.note{display:flex;gap:8px;align-items:center}
.note span{min-width:110px;font-size:.9rem;color:var(--muted)}
.note input{flex:1;min-width:0}
input.t,textarea.t,select.t{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
textarea.t{min-height:110px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;line-height:1}
.step input{width:76px;text-align:center}
.yn{display:flex;gap:6px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{position:relative;border-radius:10px;overflow:hidden;background:var(--sunk);aspect-ratio:4/3}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:6px;left:6px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:1.1rem}
.ph .up{position:absolute;bottom:6px;right:6px;font-size:.75rem;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:1px 8px}
.bar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;justify-content:space-between}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--band);color:var(--gold);border:1px solid var(--gold);padding:10px 18px;border-radius:999px;z-index:60;max-width:calc(100% - 32px);text-align:center}
/* plan editor */
#planEd{position:fixed;inset:0;z-index:50;background:#2a2f2d;display:flex;flex-direction:column}
#planEd .tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--band);padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;border-bottom:1px solid var(--gold)}
#planEd .tb button{border:1px solid rgba(201,157,71,.45);background:var(--band-2);color:var(--band-fg);border-radius:10px;padding:8px 12px;min-height:44px;font-weight:600}
#planEd .tb button[aria-pressed="true"]{background:var(--gold);color:var(--band)}
#planEd .tb .sp{flex:1}
#planEd .stage{flex:1;position:relative;overflow:hidden;touch-action:none}
#planEd canvas{position:absolute;inset:0;width:100%;height:100%}
#planEd .msg{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(31,52,39,.9);color:var(--band-fg);padding:6px 14px;border-radius:999px;font-size:.9rem;pointer-events:none}
.pop{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.pop .box{background:var(--surface);border-radius:var(--r);padding:18px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.pop .box h3{margin:0}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;max-height:60vh;overflow:auto}
.pages button{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:6px}
.pages img{width:100%;display:block}
.floor{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--sunk)}
.items{display:flex;flex-wrap:wrap;gap:8px}
.item{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--band);border-radius:12px;padding:6px 8px 6px 10px}
.item.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,157,71,.35)}
.item .sub{display:inline-flex;align-items:center;gap:2px;background:var(--sunk);border-radius:8px;padding:2px 6px;font-size:.9rem}
.item button{border:0;background:none;font-size:1rem;padding:4px 6px;color:var(--muted)}
.item .incl{color:var(--gold-2);font-weight:700;font-size:.85rem}
.chip.sp{padding:8px 12px;min-height:44px}
.preview{white-space:pre-line;background:var(--surface);border:1px dashed var(--gold);border-radius:10px;padding:10px 12px;font-weight:600}
#cam{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
#cam video{flex:1;width:100%;height:100%;object-fit:contain;background:#000}
#cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#cam .flash.go{animation:fl .25s ease-out}
@keyframes fl{0%{opacity:.7}100%{opacity:0}}
.cam-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-around;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.6))}
.shutter{width:84px;height:84px;border-radius:50%;border:6px solid #fff;background:rgba(255,255,255,.25)}
.shutter:active{background:#fff}
.cam-done{background:var(--gold);color:var(--band);border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:1.05rem}
.cam-last{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:2px solid #fff;background:#222}
.cam-last img{width:100%;height:100%;object-fit:cover}
.cam-n{position:absolute;top:2px;left:2px;background:var(--gold);color:var(--band);border-radius:999px;padding:0 7px;font-weight:700;font-size:.8rem}
@media (orientation:landscape){.cam-bar{top:0;left:auto;width:130px;flex-direction:column;background:linear-gradient(to left,rgba(0,0,0,.6),transparent)}}
.planthumb{max-width:100%;border:1px solid var(--line);border-radius:10px;background:#fff}
</style>
</head>
<body>
<header class="top">
  <span class="mark">BRUCK</span>
  <h1 id="title">ביקור בנכס</h1>
  <span class="net" id="net">…</span>
  <button class="ib hidden" id="backBtn" type="button">רשימה</button>
</header>
<main id="main"></main>
<div id="toast" class="toast hidden"></div>
<script src="vendor/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
